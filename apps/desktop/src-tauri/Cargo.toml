[package]
name = "anime-pic-manage"
version = "0.1.0"
description = "Local-first anime image management desktop application"
authors = ["RoamerFly"]
edition = "2021"

[lib]
name = "anime_pic_manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
zip = "4"
chrono = { version = "0.4", features = ["serde"] }
# Local ComfyUI is reached over plain HTTP on 127.0.0.1, so no TLS backend is
# required; keeping default features off avoids extra native build steps.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
