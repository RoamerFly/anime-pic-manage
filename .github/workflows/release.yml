name: Release (Windows installer + portable)

# 触发方式：
#   * 推送 v*.*.* 标签：构建并发布该版本
#   * 手动运行：可指定版本、是否包含 GPU 包、是否真的创建 Release（默认只做构建干跑）
#
# 产物：
#   * AnimePicManage-<版本>-windows-x64-setup.exe     标准 Windows 安装器（NSIS，含卸载选项）
#   * AnimePicManage-<版本>-windows-x64-portable.zip  轻量程序包（不含运行时/模型）
#   * AnimePicManage-<版本>-windows-x64-<cpu|gpu>-runtime.zip  独立 AI 运行环境
#   * AnimePicManage-<版本>-windows-x64-models.zip    可选模型包（解压进便携包目录即可）
#   * AnimePicManage-<版本>-windows-x64-gpu-cuda.zip GPU CUDA/cuDNN 分包
#   * latest.json                                     应用内“检查更新”使用的清单

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.2.0（留空则用 tauri.conf.json 里的版本）'
        required: false
        type: string
      include_gpu:
        description: '是否额外构建 GPU 版安装器与便携包（耗时更长）'
        required: false
        type: boolean
        default: false
      publish:
        description: '是否创建 GitHub Release（关闭则只做构建干跑并上传 Artifact）'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer and portable packages
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and publish flag
        id: meta
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version) -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "版本号不合法: $version"
          }
          $publish = ('${{ github.event_name }}' -eq 'push') -or ('${{ github.event.inputs.publish }}' -eq 'true')
          $includeGpu = ('${{ github.event.inputs.include_gpu }}' -eq 'true')
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "include_gpu=$($includeGpu.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version publish=$publish gpu=$includeGpu"

      - name: Require the updater signing secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '缺少 TAURI_SIGNING_PRIVATE_KEY：先在仓库 Secrets 里配置更新签名私钥，再发布。'
          }
          Write-Output '签名私钥已配置（值不会被打印）。'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Enable pnpm and install dependencies
        shell: pwsh
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check the workspace
        shell: pwsh
        run: |
          pnpm lint
          pnpm test

      - name: Stamp the release version
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $confPath = 'apps/desktop/src-tauri/tauri.conf.json'
          $conf = Get-Content $confPath -Raw
          $conf = [regex]::Replace($conf, '("version"\s*:\s*")[^"]+(")', "`${1}$version`${2}", 1)
          Set-Content -Path $confPath -Value $conf -Encoding utf8 -NoNewline

          foreach ($toml in @('apps/desktop/src-tauri/Cargo.toml')) {
            $text = Get-Content $toml -Raw
            $text = [regex]::Replace($text, '(?m)^(version\s*=\s*")[^"]+(")', "`${1}$version`${2}", 1)
            Set-Content -Path $toml -Value $text -Encoding utf8 -NoNewline
          }

          foreach ($pkg in @('package.json', 'apps/desktop/package.json', 'apps/ai-worker/pyproject.toml')) {
            if (-not (Test-Path $pkg)) { continue }
            $text = Get-Content $pkg -Raw
            $text = [regex]::Replace($text, '(?m)^(version\s*=\s*")[^"]+(")', "`${1}$version`${2}", 1)
            $text = [regex]::Replace($text, '("version"\s*:\s*")[^"]+(")', "`${1}$version`${2}", 1)
            Set-Content -Path $pkg -Value $text -Encoding utf8 -NoNewline
          }
          Write-Output "stamped version $version"

      - name: Build the CPU portable package
        shell: pwsh
        run: |
          # 便携包脚本只负责打包，桌面程序要先编译出来（与本地 build.bat 一致）。
          pnpm --filter @anime-pic-manage/desktop exec tauri build --no-bundle
          ./scripts/package_windows.ps1 -ProjectRoot . -DistName dist_windows

      - name: Build the CPU installer
        shell: pwsh
        run: |
          ./scripts/package_installer_windows.ps1 -ProjectRoot . -DistName dist_windows

      - name: Build the GPU portable package and installer
        if: ${{ steps.meta.outputs.include_gpu == 'true' }}
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1 -ProjectRoot . -DistName dist_windows_gpu -Cuda
          ./scripts/package_installer_windows.ps1 -ProjectRoot . -DistName dist_windows_gpu -Cuda

      - name: Collect the release assets
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $assets = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null

          $installer = Get-ChildItem 'dist_windows/installer/*-setup.exe' | Select-Object -First 1
          Copy-Item $installer.FullName (Join-Path $assets "AnimePicManage-$version-windows-x64-setup.exe")

          # 程序本体、AI 环境、模型与 CUDA 分层发布。应用更新只替换小程序包，
          # 已安装环境由设置页按独立版本继续复用。
          $launcher = ([char]0x542F) + ([char]0x52A8) + '.bat'
          $guide = ([char]0x4F7F) + ([char]0x7528) + ([char]0x8BF4) + ([char]0x660E) + '.txt'
          $cpuPortable = Join-Path $assets "AnimePicManage-$version-windows-x64-portable.zip"
          Push-Location 'dist_windows'
          try {
            & 7z a -tzip $cpuPortable 'resources' 'anime-pic-manage.exe' `
              'BUILD_FLAVOR.txt' $launcher $guide | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "CPU portable archive failed ($LASTEXITCODE)." }
          } finally {
            Pop-Location
          }
          $cpuRuntime = Join-Path $assets "AnimePicManage-$version-windows-x64-cpu-runtime.zip"
          Push-Location 'dist_windows/app'
          try {
            & 7z a -tzip $cpuRuntime 'env' 'runtime' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "CPU runtime archive failed ($LASTEXITCODE)." }
          } finally {
            Pop-Location
          }
          $modelsArchive = Join-Path $assets "AnimePicManage-$version-windows-x64-models.zip"
          Push-Location 'dist_windows'
          try {
            & 7z a -tzip $modelsArchive 'models' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Models archive failed ($LASTEXITCODE)." }
          } finally {
            Pop-Location
          }

          if ('${{ steps.meta.outputs.include_gpu }}' -eq 'true') {
            $gpuInstaller = Get-ChildItem 'dist_windows_gpu/installer/*-setup.exe' | Select-Object -First 1
            Copy-Item $gpuInstaller.FullName (Join-Path $assets "AnimePicManage-$version-windows-x64-gpu-setup.exe")
            $gpuPortable = Join-Path $assets "AnimePicManage-$version-windows-x64-gpu-portable.zip"
            $gpuRuntime = Join-Path $assets "AnimePicManage-$version-windows-x64-gpu-runtime.zip"
            $gpuCuda = Join-Path $assets "AnimePicManage-$version-windows-x64-gpu-cuda.zip"
            Push-Location 'dist_windows_gpu'
            try {
              & 7z a -tzip $gpuPortable 'resources' 'anime-pic-manage.exe' `
                'BUILD_FLAVOR.txt' $launcher $guide | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "GPU portable archive failed ($LASTEXITCODE)." }
              Push-Location 'app'
              try {
                & 7z a -tzip $gpuRuntime 'env' 'runtime' | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "GPU runtime archive failed ($LASTEXITCODE)." }
              } finally {
                Pop-Location
              }
              & 7z a -tzip $gpuCuda 'app/cuda' | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "GPU CUDA archive failed ($LASTEXITCODE)." }
            } finally {
              Pop-Location
            }
          }

          # Managed environment downloads require a companion checksum. The
          # app verifies it before extraction and keeps partial files for resume.
          Get-ChildItem $assets -Filter '*-runtime.zip' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n", (New-Object Text.UTF8Encoding($false)))
          }

          # 应用内“检查更新”读取这个清单；签名文件由 Tauri 随安装器一起产出。
          # The optional GPU installer is built after the CPU installer and
          # reuses Tauri's bundle directory. Read the signature copied beside
          # the CPU installer so latest.json can never embed the GPU signature.
          $signature = Get-ChildItem 'dist_windows/installer/*-setup.exe.sig' | Select-Object -First 1
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/${{ steps.meta.outputs.tag }}/AnimePicManage-$version-windows-x64-setup.exe"
          $manifest = [ordered]@{
            version = $version
            notes = '见 Release 说明'
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{ signature = (Get-Content $signature.FullName -Raw).Trim(); url = $downloadUrl } }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $assets 'latest.json') -Encoding utf8

          Get-ChildItem $assets | ForEach-Object {
            if ($_.Length -ge 2GB) { throw "Release asset exceeds 2GB: $($_.Name)" }
            Write-Output ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Publish the GitHub Release
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $notes = @'
          ## 新版本内容

          - 发布标准 Windows 安装器与便携包。
          - 安装器会自动沿用上次的安装目录；卸载时可选择是否删除缓存、模型与训练产物。
          - 程序本体、AI 运行环境、模型和 CUDA 分层发布；小版本更新不会重复下载大型环境。

          ## 下载建议

          - 日常安装：下载 `*-setup.exe`，首次打开后在“设置 → 基础配置”准备 AI 环境与 CUDA。
          - 离线便携：下载 `*-portable.zip`、匹配的 `*-runtime.zip` 与 `*-models.zip`，解压到同一文件夹。
          - NVIDIA 显卡版：另下载 `*-gpu-cuda.zip`；安装器不内嵌 2.1GB CUDA，以避免安装器格式与平台单文件上限。
          '@
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --notes $notes
          }
          gh release upload $tag release-assets/* --clobber

      - name: Keep the assets for a dry run
        if: ${{ steps.meta.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.meta.outputs.version }}
          path: release-assets/*
          retention-days: 7
